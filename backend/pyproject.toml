[project]
name = "caption-relay"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.30",
  "httpx2>=2.13.1",
  "cryptography>=50.0.2",
  "websockets>=17,<18",
  "webrtcvad-wheels>=2.0.14,<3",
  "soxr>=1.1,<2",
  "numpy>=2,<3",
  "anyio>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyright>=1.1.414",
]
desktop = [
    "pyinstaller>=6.22,<7",
    "pyinstaller-hooks-contrib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.uv.sources]
pyinstaller-hooks-contrib = { git = "https://github.com/Eotel/pyinstaller-hooks-contrib", rev = "4e87e47a6a9d411b539d26a3742251a6546ce25e" }
